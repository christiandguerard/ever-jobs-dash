name: Daily Job Scrape
on:
  schedule:
    - cron: '0 9 * * *' # 9:00 AM UTC
  workflow_dispatch: # Allows manual testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Scraper
        run: npm run build

      - name: Run Scraper Loop
        run: |
          # Detect the correct CLI path (NestJS builds can vary slightly)
          CLI_PATH="dist/cli/main.js"
          if [ -f "dist/apps/cli/main.js" ]; then
            CLI_PATH="dist/apps/cli/main.js"
          fi

          # Start a fresh CSV
          # Header row is automatically generated by the tool in the first temp file
          rm -f daily_jobs.csv
          
          while IFS=: read -r source slug || [ -n "$source" ]; do
            [[ "$source" =~ ^#.*$ || -z "$source" ]] && continue
            
            echo "Scraping $slug from $source..."
            
            # Use 'search' command with correct flags
            node $CLI_PATH search -s $source --company-slug $slug -f csv -o temp.csv
            
            if [ -f "temp.csv" ]; then
              if [ ! -f "daily_jobs.csv" ]; then
                cat temp.csv > daily_jobs.csv
              else
                # Append data skip the header row
                tail -n +2 temp.csv >> daily_jobs.csv
              fi
              rm temp.csv
            fi
          done < my_companies.txt

      - name: Commit and Push Results
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add daily_jobs.csv
          git commit -m "Update daily job list: $(date)" || echo "No changes to commit"
          git push
