name: Daily Job Scrape
on:
  schedule:
    - cron: '0 9 * * *' # 9:00 AM UTC
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Scraper
        run: npm run build

      - name: Run Scraper Loop
        run: |
          # Detect the correct CLI path
          CLI_PATH="dist/cli/main.js"
          if [ -f "dist/apps/cli/main.js" ]; then
            CLI_PATH="dist/apps/cli/main.js"
          fi

          # Create a fresh CSV with a clean header
          echo "Site,Title,Company,Location,URL,Date" > daily_jobs.csv
          
          while IFS=: read -r source slug || [ -n "$source" ]; do
            [[ "$source" =~ ^#.*$ || -z "$source" ]] && continue
            
            echo "Scraping $slug from $source..."
            
            # Run the search, outputting to a temporary file
            node $CLI_PATH search -s $source --company-slug $slug -f csv -o temp.csv
            
            if [ -f "temp.csv" ]; then
              # CLEANUP LOGIC: Use awk to select only columns 2 through 7.
              # This removes column 14 (the description) which contains the line breaks that broke your CSV.
              tail -n +2 temp.csv | awk -F',' '{print $2","$3","$4","$5","$6","$7}' >> daily_jobs.csv
              rm temp.csv
            fi
          done < my_companies.txt

      - name: Commit and Push Results
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add daily_jobs.csv
          git commit -m "Update clean job list: $(date)" || echo "No changes to commit"
          git push
