name: Daily Job Scrape
on:
  schedule:
    - cron: '0 9 * * *' # Runs at 9:00 AM UTC daily
  workflow_dispatch: # Allows you to click "Run workflow" manually

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        # Using install + legacy-peer-deps to bypass the errors you saw
        run: npm install --legacy-peer-deps

      - name: Build Scraper
        # The tool needs to be compiled before it can run
        run: npm run build

      - name: Run Scraper Loop
        run: |
          # Clear the file first so we don't have old duplicates
          echo "Source,Company,Title,Location,Link" > daily_jobs.csv
          
          # This reads your my_companies.txt (format: source:slug)
          while IFS=: read -r source slug || [ -n "$source" ]; do
            # Skip empty lines or comments
            [[ "$source" =~ ^#.*$ || -z "$source" ]] && continue
            
            echo "Scraping $slug from $source..."
            # Runs the tool and appends results to our CSV
            node dist/cli.js $source $slug --format csv >> daily_jobs.csv
          done < my_companies.txt

      - name: Commit and Push Results
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add daily_jobs.csv
          git commit -m "Update daily job list: $(date)" || echo "No changes to commit"
          git push
