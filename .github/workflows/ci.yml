name: Daily Job Scrape
on:
  schedule:
    - cron: '0 12 * * *' # Runs at 7:00 AM Montreal Time
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Scraper
        run: npm run build

      - name: Run Scraper Loop
        env:
          LOG_LEVEL: error
        run: |
          CLI_PATH="dist/cli/main.js"
          if [ -f "dist/apps/cli/main.js" ]; then
            CLI_PATH="dist/apps/cli/main.js"
          fi

          echo "Site,Title,Company,Location,URL,Date" > daily_jobs.csv
          
          while IFS=: read -r source slug || [ -n "$source" ]; do
            [[ "$source" =~ ^#.*$ || -z "$source" ]] && continue
            
            echo "Scraping $slug from $source..."
            node $CLI_PATH search -s $source --company-slug $slug -f csv -o temp.csv --timeout 30000
            
            if [ -f "temp.csv" ]; then
              python clean_jobs.py
              rm temp.csv
            fi
          done < my_companies.txt

      - name: Commit and Push Results
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add daily_jobs.csv
          git commit -m "Update job dashboard: $(date)" || echo "No changes"
          git push
