name: Daily Job Scrape
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Scraper
        run: npm run build

      - name: Run Scraper Loop
        run: |
          CLI_PATH="dist/cli/main.js"
          if [ -f "dist/apps/cli/main.js" ]; then
            CLI_PATH="dist/apps/cli/main.js"
          fi

          echo "Site,Title,Company,Location,URL,Date" > daily_jobs.csv
          
          while IFS=: read -r source slug || [ -n "$source" ]; do
            [[ "$source" =~ ^#.*$ || -z "$source" ]] && continue
            
            echo "Scraping $slug from $source..."
            node $CLI_PATH search -s $source --company-slug $slug -f csv -o temp.csv
            
            if [ -f "temp.csv" ]; then
              # Using the | symbol allows us to write Python without quote errors
              python3 - <<'EOF'
import csv
fields = ['site', 'title', 'companyName', 'location', 'jobUrl', 'datePosted']
try:
    with open('temp.csv', 'r', encoding='utf-8') as f_in:
        reader = csv.DictReader(f_in)
        with open('daily_jobs.csv', 'a', encoding='utf-8', newline='') as f_out:
            writer = csv.writer(f_out)
            for row in reader:
                # This only pulls the clean columns and ignores the description
                writer.writerow([row.get(f, '').strip() for f in fields])
except Exception as e:
    print(f"Error: {e}")
EOF
              rm temp.csv
            fi
          done < my_companies.txt

      - name: Commit and Push Results
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add daily_jobs.csv
          git commit -m "Update clean job dashboard: $(date)" || echo "No changes to commit"
          git push
