name: Daily Job Scrape
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Bumped to 20 to satisfy all package requirements

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Scraper
        run: npm run build

      - name: Run Scraper Loop
        run: |
          # Start a fresh CSV with headers
          echo "Source,Company,Title,Location,Link" > daily_jobs.csv
          
          # Auto-detect where the build process put the compiled CLI
          CLI_PATH="dist/cli/main.js"
          if [ -f "dist/apps/cli/main.js" ]; then
            CLI_PATH="dist/apps/cli/main.js"
          fi
          
          # This reads your my_companies.txt
          while IFS=: read -r source slug || [ -n "$source" ]; do
            [[ "$source" =~ ^#.*$ || -z "$source" ]] && continue
            
            echo "Scraping $slug from $source..."
            node $CLI_PATH $source $slug --format csv >> daily_jobs.csv
          done < my_companies.txt

      - name: Commit and Push Results
        run: |
          git config --global user.name "JobBot"
          git config --global user.email "bot@github.com"
          git add daily_jobs.csv
          git commit -m "Update daily job list: $(date)" || echo "No changes to commit"
          git push
